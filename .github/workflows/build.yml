name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

# una sola compilación por rama: cancela las anteriores para no apilar ejecuciones
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-2022
        - name: Android32
          os: ubuntu-24.04
          target: Android32
        - name: Android64
          os: ubuntu-24.04
          target: Android64
        # macOS e iOS desactivados: fallan por bindings que faltan en 2.2091 y retrasan el paquete

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: 'TheSillyDoggo/bindings'
          #build-config: 'RelWithDebInfo'
          build-config: 'Release'
          export-pdb: true
          combine: true
          #sdk: 'nightly'
          target: ${{ matrix.config.target }}
      
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    # empaqueta lo que sí compiló aunque otra plataforma falle
    if: ${{ !cancelled() }}

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
